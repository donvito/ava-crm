<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deals · AVA CRM</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <main>
      <h1>Deals</h1>

      <section class="card" aria-labelledby="add-deal-heading">
        <h2 id="add-deal-heading">Add deal</h2>
        <form class="entity-form" id="deal-form">
          <div class="field">
            <label for="deal-title">Title</label>
            <input id="deal-title" name="title" autocomplete="off" />
          </div>
          <div class="field">
            <label for="deal-value">Value (USD)</label>
            <input
              id="deal-value"
              name="value"
              inputmode="decimal"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="deal-contact">Contact</label>
            <select id="deal-contact" name="contact_id">
              <option value="">No contact</option>
            </select>
          </div>
          <div class="field">
            <label for="deal-company">Company</label>
            <select id="deal-company" name="company_id">
              <option value="">No company</option>
            </select>
          </div>
          <button type="submit">Add deal</button>
        </form>
        <p class="form-error" id="deal-form-error" role="alert"></p>
      </section>

      <section class="card" aria-labelledby="pipeline-heading">
        <h2 id="pipeline-heading">Pipeline</h2>
        <div class="toolbar">
          <label for="stage-filter">Filter by stage</label>
          <select id="stage-filter">
            <option value="">All stages</option>
          </select>
        </div>
        <table aria-label="Deals">
          <thead>
            <tr>
              <th>Title</th>
              <th>Value</th>
              <th>Contact</th>
              <th>Company</th>
              <th>Stage</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="deal-rows"></tbody>
        </table>
        <p class="empty-state" id="deal-empty" hidden>No deals yet.</p>
      </section>
    </main>
    <script type="module" src="/deals/deals.js"></script>
  </body>
</html>
