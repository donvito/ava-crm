<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companies · AVA CRM</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <main>
      <h1>Companies</h1>

      <section class="card" aria-labelledby="add-company-heading">
        <h2 id="add-company-heading">Add company</h2>
        <form class="entity-form" id="company-form">
          <div class="field">
            <label for="company-name">Name</label>
            <input id="company-name" name="name" autocomplete="off" />
          </div>
          <div class="field">
            <label for="company-industry">Industry</label>
            <input id="company-industry" name="industry" autocomplete="off" />
          </div>
          <div class="field">
            <label for="company-website">Website</label>
            <input id="company-website" name="website" autocomplete="off" />
          </div>
          <button type="submit">Add company</button>
        </form>
        <p class="form-error" id="company-form-error" role="alert"></p>
      </section>

      <section class="card" aria-labelledby="company-list-heading">
        <h2 id="company-list-heading">All companies</h2>
        <table aria-label="Companies">
          <thead>
            <tr>
              <th>Name</th>
              <th>Industry</th>
              <th>Website</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="company-rows"></tbody>
        </table>
        <p class="empty-state" id="company-empty" hidden>No companies yet.</p>
      </section>
    </main>
    <script type="module" src="/companies/companies.js"></script>
  </body>
</html>
